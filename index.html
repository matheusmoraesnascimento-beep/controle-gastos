<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meus Gastos</title>
<style>
  :root { --bg:#f4f6f5; --card:#fff; --txt:#111827; --mut:#6b7280; --ok:#16a34a; --bad:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1512; --card:#18211d; --txt:#f3f4f6; --mut:#9ca3af; --line:#2a3631; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--txt);
         padding:12px 16px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin-inline:auto; }
  header { display:flex; justify-content:space-between; align-items:center; margin:4px 0 12px; }
  h1 { font-size:20px; margin:0; }
  button { font:inherit; cursor:pointer; }
  .icon-btn { background:none; border:0; font-size:24px; color:var(--txt); padding:4px 8px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .big { font-size:28px; font-weight:700; }
  .mut { color:var(--mut); font-size:14px; }
  .bar { height:12px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; background:var(--ok); width:0; transition:width .3s; }
  .bar.over > div { background:var(--bad); }
  .over-txt { color:var(--bad); font-weight:600; }
  form { display:grid; gap:8px; }
  input { font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--txt); width:100%; }
  select { font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--txt); width:100%; }
  input.err { border-color:var(--bad); }
  .err-msg { color:var(--bad); font-size:14px; min-height:18px; }
  .primary { background:var(--ok); color:#fff; border:0; border-radius:10px; padding:12px; font-weight:600; }
  .day { padding:10px 0; border-top:1px solid var(--line); }
  .day:first-child { border-top:0; }
  .day-head { display:flex; justify-content:space-between; font-weight:600; }
  .day.today .day-head { color:var(--ok); }
  .item { display:flex; justify-content:space-between; gap:8px; padding:6px 0 0 8px; font-size:15px; background:none; border:0; width:100%; text-align:left; color:var(--txt); }
  .item .d { color:var(--mut); }
  #settings { display:none; }
  #settings.open { display:block; }
  #warn { display:none; color:var(--bad); font-size:14px; margin-bottom:8px; }
</style>
</head>
<body>
<header>
  <h1>Meus Gastos</h1>
  <button class="icon-btn" id="gear" aria-label="Configurações">⚙️</button>
</header>
<div id="warn">Não consegui salvar no aparelho. Os dados podem se perder.</div>

<section class="card" id="settings">
  <label class="mut" for="budget-input">Orçamento semanal (R$)</label>
  <form id="budget-form">
    <input id="budget-input" inputmode="decimal" autocomplete="off">
    <label class="mut" for="start-day">A semana começa em</label>
    <select id="start-day">
      <option value="1">Segunda</option><option value="2">Terça</option><option value="3">Quarta</option>
      <option value="4">Quinta</option><option value="5">Sexta</option><option value="6">Sábado</option>
      <option value="0">Domingo</option>
    </select>
    <div class="err-msg" id="budget-err"></div>
    <button class="primary" type="submit">Salvar</button>
  </form>
</section>

<section class="card" id="summary">
  <div class="mut">Semana</div>
  <div class="big" id="week-text"></div>
  <div class="bar" id="bar"><div id="bar-fill"></div></div>
  <div id="remaining"></div>
</section>

<section class="card">
  <div class="mut">Hoje</div>
  <div class="big" id="today-total"></div>
</section>

<section class="card">
  <form id="add-form">
    <input id="amount" inputmode="decimal" placeholder="Valor (ex: 12,50)" autocomplete="off">
    <input id="desc" placeholder="Descrição (opcional)" autocomplete="off">
    <div class="err-msg" id="amount-err"></div>
    <button class="primary" type="submit">Adicionar</button>
  </form>
</section>

<section class="card" id="days"></section>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
